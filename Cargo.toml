[package]
name = "keydibs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Find keybindings that never fire because another layer (compositor, terminal, shell, editor) grabs them first"
license = "MIT"
repository = "https://github.com/Blzs2005/keydibs"
readme = "README.md"
exclude = [".github"]
keywords = ["keybindings", "shortcuts", "kde", "terminal", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
