[package]
name = "keydibs"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Find keyboard shortcuts that clash between your desktop, terminal, shell and editor"
license = "MIT"
repository = "https://github.com/Blzs2005/keydibs"
readme = "README.md"
exclude = [".github"]
keywords = ["keybindings", "shortcuts", "kde", "terminal", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
json5 = "1.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
xkbcommon-dl = "0.4.2"
